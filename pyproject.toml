[project]
name = "photo-highlights"
version = "0.1.0"
description = "Self-hosted family-photo curation on top of Immich: local ML ranking (quality, expression, moments), human-in-the-loop selection, optional Pixtale gallery sync."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyiqa>=0.1.10",
    "flask>=3.1.3",
    "numpy>=2.4.2",
    "piexif>=1.1.3",
    "pillow>=12.1.1",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "torch>=2.10.0",
    "transformers>=4.37.0",
    "opencv-python-headless>=4.13.0.92",
    # Use MediaPipe Tasks API (mediapipe>=0.10.31, no .solutions namespace)
    "mediapipe>=0.10.31",
]
